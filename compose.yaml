services:
  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
  backend:
    build: ./backend
    env_file: backend/.env
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready',timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  gateway:
    image: nginx:1.28-alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
  deletion-worker:
    build: ./backend
    env_file: backend/.env
    command: ["sh", "-c", "while true; do .venv/bin/python -m app.publisher retry-deletions; sleep 60; done"]
    restart: unless-stopped
