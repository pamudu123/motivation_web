events {}
http {
  # No query strings, credentials or callback tokens in request logs.
  log_format safe '$remote_addr $request_method $uri $status $request_time';
  access_log /var/log/nginx/access.log safe;
  limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
  server {
    listen 80;
    client_max_body_size 64k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location /api/v1/ {
      limit_req zone=api burst=30 nodelay;
      limit_req_status 429;
      error_page 429 = @rate_limited;
      proxy_pass http://backend:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 20s;
    }
    location @rate_limited {
      default_type application/json;
      return 429 '{"error":{"code":"rate_limited","message":"Please slow down and try again.","requestId":"$request_id"}}';
    }
    location / {
      proxy_pass http://frontend:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
